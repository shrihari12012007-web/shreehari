    <text x="20" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Linked Lists, Trees, Stacks, Queues, Graphs &amp; Algorithms.</text>
    <rect x="20" y="145" width="120" height="26" rx="6" fill="rgba(56,189,248,0.15)"/>
    <text x="80" y="162" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">VIEW MODULE</text>

    <rect x="175" width="160" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
