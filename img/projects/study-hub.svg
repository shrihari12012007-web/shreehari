<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#0f1f33"/>
    </linearGradient>
    <linearGradient id="blueCurv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgStudy)" rx="16"/>
  
  <!-- Browser Chrome Topbar -->
  <rect width="600" height="36" fill="#040810" rx="16 16 0 0"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
  <text x="300" y="22" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">shrihari12012007-web.github.io/STUDY</text>

