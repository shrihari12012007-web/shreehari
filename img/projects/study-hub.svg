    <text x="195" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Process threads, CPU scheduling, Memory Management.</text>
    <rect x="195" y="145" width="120" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="255" y="162" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">VIEW MODULE</text>

    <rect x="350" width="160" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="370" y="38" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22">🌐</text>
    <text x="370" y="70" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Computer Networks</text>
    <text x="370" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">OSI / TCP-IP models, Routing protocols, Socket API.</text>
