<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f1929"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgGest)" rx="16"/>
  
  <!-- Browser Chrome Topbar -->
  <rect width="600" height="36" fill="#05080e" rx="16 16 0 0"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
  <text x="300" y="22" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">opencv-mediapipe // 21-Landmark Gesture Tracker</text>

  <!-- Viewfinder Frame -->
  <rect x="60" y="55" width="480" height="270" rx="12" fill="#080c14" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Camera Crosshairs -->
  <path d="M 75 75 L 95 75 M 75 75 L 75 95" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 525 75 L 505 75 M 525 75 L 525 95" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 75 305 L 95 305 M 75 305 L 75 285" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 525 305 L 505 305 M 525 305 L 525 285" stroke="#10b981" stroke-width="2.5" fill="none"/>

  <!-- Hand Skeleton 21 Landmark Representation -->
  <g transform="translate(180, 70)" stroke="#10b981" stroke-width="2" fill="#10b981">
    <!-- Wrist -->
    <circle cx="120" cy="200" r="4.5"/>
    
    <!-- Thumb -->
    <line x1="120" y1="200" x2="85" y2="175"/>
    <circle cx="85" cy="175" r="4"/>
    <line x1="85" y1="175" x2="60" y2="155"/>
    <circle cx="60" cy="155" r="4"/>
    <line x1="60" y1="155" x2="45" y2="135"/>
    <circle cx="45" cy="135" r="4"/>

    <!-- Index Finger -->
    <line x1="120" y1="200" x2="95" y2="140"/>
    <circle cx="95" cy="140" r="4"/>
    <line x1="95" y1="140" x2="90" y2="100"/>
    <circle cx="90" cy="100" r="4"/>
    <line x1="90" y1="100" x2="88" y2="65"/>
    <circle cx="88" cy="65" r="5" fill="#00f0ff"/>

    <!-- Middle Finger -->
    <line x1="120" y1="200" x2="120" y2="135"/>
    <circle cx="120" cy="135" r="4"/>
    <line x1="120" y1="135" x2="120" y2="90"/>
    <circle cx="120" cy="90" r="4"/>
    <line x1="120" y1="90" x2="120" y2="50"/>
    <circle cx="120" cy="50" r="5" fill="#00f0ff"/>

    <!-- Ring Finger -->
    <line x1="120" y1="200" x2="145" y2="140"/>
    <circle cx="145" cy="140" r="4"/>
    <line x1="145" y1="140" x2="150" y2="105"/>
    <circle cx="150" cy="105" r="4"/>
    <line x1="150" y1="105" x2="152" y2="75"/>
    <circle cx="152" cy="75" r="4"/>

    <!-- Pinky Finger -->
    <line x1="120" y1="200" x2="170" y2="155"/>
    <circle cx="170" cy="155" r="4"/>
    <line x1="170" y1="155" x2="180" y2="125"/>
    <circle cx="180" cy="125" r="4"/>
    <line x1="180" y1="125" x2="185" y2="95"/>
    <circle cx="185" cy="95" r="4"/>
  </g>

  <!-- Status HUD Badge -->
  <rect x="80" y="75" width="165" height="30" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="92" y="94" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">GESTURE: PEACE (V)</text>
  <rect x="80" y="112" width="165" height="26" rx="6" fill="rgba(0,0,0,0.5)"/>
  <text x="92" y="129" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="11">ACTION: CAPTURE PHOTO</text>
</svg>