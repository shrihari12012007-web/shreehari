<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNova" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#111420"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgNova)" rx="16"/>
  
  <!-- Browser Chrome Topbar -->
  <rect width="600" height="36" fill="#080a0f" rx="16 16 0 0"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="240" height="20" rx="10" fill="#151922"/>
  <text x="300" y="22" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">nova-cuts.onrender.com</text>

  <!-- App Header -->
  <text x="40" y="80" fill="url(#goldGrad)" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" letter-spacing="1">NOVA CUTS</text>
  <text x="40" y="102" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Luxury Barbershop &amp; Precision Grooming</text>
  
  <!-- Scissors Icon -->
  <g transform="translate(490, 60)" stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <circle cx="16" cy="16" r="8"/>
    <circle cx="16" cy="48" r="8"/>
    <line x1="22" y1="22" x2="52" y2="52"/>
    <line x1="22" y1="42" x2="52" y2="12"/>
  </g>

  <!-- Service Cards Grid -->
  <g transform="translate(40, 130)">
    <!-- Card 1 -->
    <rect width="160" height="180" rx="12" fill="url(#cardGrad)" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <circle cx="36" cy="36" r="16" fill="rgba(212,175,55,0.15)"/>
    <text x="36" y="42" fill="#d4af37" font-family="'Space Grotesk', sans-serif" font-size="16" text-anchor="middle">✂</text>
    <text x="20" y="80" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Signature Cut</text>
    <text x="20" y="100" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Precision styling &amp; wash</text>
    <text x="20" y="130" fill="url(#goldGrad)" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">₹499</text>
    <rect x="20" y="145" width="120" height="24" rx="12" fill="rgba(212,175,55,0.2)"/>
    <text x="80" y="161" fill="#f3e5ab" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">BOOK SERVICE</text>

    <!-- Card 2 -->
    <rect x="180" width="160" height="180" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="216" cy="36" r="16" fill="rgba(255,255,255,0.08)"/>
    <text x="216" y="42" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" text-anchor="middle">💈</text>
    <text x="200" y="80" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Beard Sculpt</text>
    <text x="200" y="100" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Hot towel &amp; razor trim</text>
    <text x="200" y="130" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">₹299</text>
    <rect x="200" y="145" width="120" height="24" rx="12" fill="rgba(255,255,255,0.08)"/>
    <text x="260" y="161" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">BOOK SERVICE</text>

    <!-- Card 3 -->
    <rect x="360" width="160" height="180" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="396" cy="36" r="16" fill="rgba(255,255,255,0.08)"/>
    <text x="396" y="42" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" text-anchor="middle">👑</text>
    <text x="380" y="80" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">VIP Experience</text>
    <text x="380" y="100" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Full grooming package</text>
    <text x="380" y="130" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">₹899</text>
    <rect x="380" y="145" width="120" height="24" rx="12" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="161" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">BOOK SERVICE</text>
  </g>
</svg>