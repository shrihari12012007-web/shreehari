<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgEye)" rx="16"/>
  
  <!-- Browser Chrome Topbar -->
  <rect width="600" height="36" fill="#060b13" rx="16 16 0 0"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
  <text x="300" y="22" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">srinidhi-eyecare.github.io</text>

  <!-- Clinic Brand -->
  <g transform="translate(45, 65)">
    <circle cx="20" cy="20" r="18" fill="rgba(56,189,248,0.15)"/>
    <path d="M 8 20 Q 20 6 32 20 Q 20 34 8 20 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="20" cy="20" r="5" fill="#38bdf8"/>
    <text x="48" y="26" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">Srinidhi Eye Care Hospital</text>
  </g>

  <!-- Hospital Clinical Stats Grid -->
  <g transform="translate(45, 120)">
    <rect width="160" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="20" y="35" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22">👁️</text>
    <text x="20" y="70" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Cataract Surgery</text>
    <text x="20" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Phacoemulsification &amp; MICS with foldable IOLs.</text>
    <rect x="20" y="145" width="120" height="26" rx="6" fill="rgba(56,189,248,0.15)"/>
    <text x="80" y="162" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">SPECIALTY INFO</text>

    <rect x="175" width="160" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="195" y="35" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22">🔬</text>
    <text x="195" y="70" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Retina Diagnostics</text>
    <text x="195" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Diabetic retinopathy &amp; advanced laser therapy.</text>
    <rect x="195" y="145" width="120" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="255" y="162" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">SPECIALTY INFO</text>

    <rect x="350" width="160" height="190" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="370" y="35" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="22">🩺</text>
    <text x="370" y="70" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14">Doctor Consultation</text>
    <text x="370" y="92" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Mon–Sat: 9:30 AM – 7:30 PM consultation desk.</text>
    <rect x="370" y="145" width="120" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="430" y="162" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">VIEW SCHEDULE</text>
  </g>
