<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPanda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066b1"/>
    </linearGradient>
    <radialGradient id="micGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,240,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,102,177,0)"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgPanda)" rx="16"/>
  
  <!-- Browser Chrome Topbar -->
  <rect width="600" height="36" fill="#04060a" rx="16 16 0 0"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
  <text x="300" y="22" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">panda-assistant.ai // Gemini API Audio Engine</text>

  <!-- Central Visualizer Waveform Sphere -->
  <circle cx="300" cy="165" r="75" fill="url(#micGlow)"/>
  <circle cx="300" cy="165" r="54" fill="#0a1020" stroke="url(#cyanGrad)" stroke-width="2"/>
  
  <!-- Mic Icon -->
  <g transform="translate(288, 145)" stroke="#00f0ff" stroke-width="2.2" fill="none">
    <rect x="8" y="2" width="8" height="18" rx="4" fill="#00f0ff"/>
    <path d="M4 12v3a8 8 0 0 0 16 0v-3"/>
    <line x1="12" y1="23" x2="12" y2="28"/>
    <line x1="8" y1="28" x2="16" y2="28"/>
  </g>

  <!-- Animated Soundwave Lines -->
  <g stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="150" x2="200" y2="180"/>
    <line x1="215" y1="135" x2="215" y2="195"/>
    <line x1="230" y1="120" x2="230" y2="210"/>
    <line x1="245" y1="140" x2="245" y2="190"/>
    
    <line x1="355" y1="140" x2="355" y2="190"/>
    <line x1="370" y1="120" x2="370" y2="210"/>
    <line x1="385" y1="135" x2="385" y2="195"/>
    <line x1="400" y1="150" x2="400" y2="180"/>
  </g>

  <!-- Voice Response Bubble -->
  <rect x="120" y="270" width="360" height="48" rx="24" fill="rgba(0,102,177,0.18)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
  <circle cx="145" cy="294" r="6" fill="#10b981"/>
  <text x="162" y="299" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="500">"Opening project workspace in VS Code..."</text>
  <text x="300" y="80" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" text-anchor="middle" letter-spacing="1.5">PANDA AI VOICE ASSISTANT</text>
  <text x="300" y="100" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Google Gemini API • Edge TTS • OS Automation</text>
</svg>