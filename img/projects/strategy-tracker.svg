<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStrat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#121626"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgStrat)" rx="16"/>
  
  <!-- Browser Chrome Topbar -->
  <rect width="600" height="36" fill="#06070e" rx="16 16 0 0"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
  <text x="300" y="22" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle">strategy-tracker-nine.vercel.app</text>

  <!-- Dashboard Overview Header -->
  <text x="45" y="75" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">STRATEGY TRACKER</text>
  <text x="45" y="95" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Sprint Milestones &amp; High-Impact Goal Velocity</text>

  <!-- Milestone Metric Cards -->
  <g transform="translate(45, 115)">
    <!-- Completion Ring Card -->
    <rect width="240" height="200" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(129,140,248,0.25)" stroke-width="1"/>
    <circle cx="120" cy="95" r="55" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
    <circle cx="120" cy="95" r="55" fill="none" stroke="url(#purpleG)" stroke-width="12" stroke-dasharray="345" stroke-dashoffset="86" stroke-linecap="round"/>
    <text x="120" y="92" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" text-anchor="middle">75%</text>
    <text x="120" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Sprint Velocity</text>
    <text x="120" y="175" fill="#818cf8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">18 / 24 MILESTONES DONE</text>

    <!-- Task List Widget -->
    <rect x="260" width="250" height="200" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="280" y="35" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13">High Priority Execution</text>
    
    <!-- Item 1 -->
    <g transform="translate(280, 50)">
      <rect width="16" height="16" rx="4" fill="#10b981"/>
      <text x="8" y="12" fill="#fff" font-size="10" text-anchor="middle">✓</text>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Implement Three.js Drive Mode</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(280, 80)">
      <rect width="16" height="16" rx="4" fill="#10b981"/>
      <text x="8" y="12" fill="#fff" font-size="10" text-anchor="middle">✓</text>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">OpenCV MediaPipe gesture camera</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(280, 110)">
      <rect width="16" height="16" rx="4" fill="#10b981"/>
      <text x="8" y="12" fill="#fff" font-size="10" text-anchor="middle">✓</text>
      <text x="26" y="13" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Google Gemini API integration</text>
    </g>

    <!-- Item 4 (In Progress) -->
    <g transform="translate(280, 140)">
      <rect width="16" height="16" rx="4" fill="rgba(129,140,248,0.3)" stroke="#818cf8"/>
      <circle cx="8" cy="8" r="3" fill="#818cf8"/>
      <text x="26" y="13" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11">DSA Mastery: Trees &amp; Graphs</text>
    </g>
  </g>
</svg>