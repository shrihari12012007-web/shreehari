<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bmwBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066b1"/>
      <stop offset="100%" stop-color="#004080"/>
    </linearGradient>
  </defs>
  <!-- Outer Wheel -->
  <circle cx="32" cy="32" r="30" fill="#080a10" stroke="url(#rimGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26" fill="#030408"/>
  <!-- Inner Ring -->
  <circle cx="32" cy="32" r="18" fill="#000" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- BMW M Quadrants -->
  <path d="M 32 32 L 32 14 A 18 18 0 0 0 14 32 Z" fill="url(#bmwBlue)"/>
  <path d="M 32 32 L 50 32 A 18 18 0 0 0 32 14 Z" fill="#ffffff"/>
  <path d="M 32 32 L 32 50 A 18 18 0 0 0 50 32 Z" fill="url(#bmwBlue)"/>
  <path d="M 32 32 L 14 32 A 18 18 0 0 0 32 50 Z" fill="#ffffff"/>
  <!-- Crosshairs -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#000" stroke-width="1.2"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#000" stroke-width="1.2"/>
  <!-- Text monogram SH -->
  <text x="32" y="11" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="6.5" text-anchor="middle" letter-spacing="1">BMW M</text>
</svg>